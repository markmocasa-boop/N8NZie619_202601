        "jsCode": "// Alle Daten für Shotstack vorbereiten\nconst audioUpload = $('12. Audio zu Catbox hochladen').first().json;\nconst videoData = $('15. Avatar-Bereich verarbeiten').first().json;\nconst metadata = $('10. Übersetzung parsen').first().json;\n\nreturn [{\n  json: {\n    german_audio_url: audioUpload.data,\n    video_url: videoData.processed_video_url,\n    video_public_id: videoData.video_public_id,\n    duration: metadata.duration || 60,\n    german_text: metadata.german_text,\n    title: metadata.title\n  }\n}];"
