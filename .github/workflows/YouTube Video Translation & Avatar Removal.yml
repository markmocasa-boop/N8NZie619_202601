    {
      "parameters": {
        "jsCode": "// Transkription mit Timestamps aufbereiten\nconst transcription = $input.first().json;\n\n// Segmente für Synchronisation speichern\nconst segments = transcription.segments || [];\n\n// Vollständigen Text extrahieren\nconst fullText = transcription.text;\n\n// Sprache erkennen\nconst detectedLanguage = transcription.language || 'en';\n\nreturn [{\n  json: {\n    original_text: fullText,\n    segments: segments.map(s => ({\n      start: s.start,\n      end: s.end,\n      text: s.text\n    })),\n    detected_language: detectedLanguage,\n    word_count: fullText.split(' ').length,\n    duration: segments.length > 0 ? segments[segments.length - 1].end : 0\n  }\n}];"
      },
      "id": "544b498d-cd6b-46c3-9102-8b1709f88642",
      "name": "8. Transkription aufbereiten",
