    {
      "parameters": {
        "content": "## YouTube Video Translation Workflow\n\n### Workflow-Übersicht:\n1. **Input**: YouTube URL per Webhook\n2. **Download**: Video und Audio separat herunterladen\n3. **Transkription**: Audio mit OpenAI Whisper transkribieren\n4. **Übersetzung**: Text ins Deutsche übersetzen (GPT-4)\n5. **TTS**: Deutschen Voiceover generieren (OpenAI TTS)\n6. **Avatar**: Bereich verarbeiten (Cloudinary Blur/Crop)\n7. **Merge**: Video + Audio zusammenführen (Shotstack)\n8. **Output**: Fertiges Video mit deutschem Ton\n\n### Benötigte Credentials:\n- Apify API Key\n- OpenAI API Key\n- Cloudinary Account\n- Shotstack API Key\n\n### Avatar-Entfernung Hinweis:\nFür komplexe Avatar-Entfernung (wenn der Avatar sich bewegt oder groß ist) empfehlen wir:\n1. Runway ML Inpainting (manuell)\n2. ProPainter über Replicate API\n3. Alternativ: Video ohne Avatar neu aufnehmen",
        "height": 664,
        "width": 400,
        "color": 4
      },
      "id": "60ff7e1c-4839-47d6-a30f-c27fdcfc45e6",
      "name": "Workflow Info",
      "type": "n8n-nodes-base.stickyNote",
      "typeVersion": 1,
      "position": [
        -288,
        16
      ]
    },
    {
      "parameters": {
        "content": "## Alternative: Replicate ProPainter\n\nFür automatische Avatar-Entfernung kann die ProPainter API über Replicate verwendet werden.\n\n### Voraussetzungen:\n- Avatar muss an fester Position sein\n- Maske muss definiert werden\n\n### API Endpoint:\n```\nPOST https://api.replicate.com/v1/predictions\n```\n\n### Hinweis:\nDiese Node ist optional und erfordert zusätzliche Konfiguration.",
        "height": 444,
        "width": 558,
        "color": 6
      },
      "id": "ee5aeab7-0c18-44d2-8786-4bcd0c0713d7",
