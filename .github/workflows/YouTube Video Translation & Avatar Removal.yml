    {
      "parameters": {
        "jsCode": "// Übersetzung parsen\nconst translation = $input.first().json;\nlet parsed;\n\ntry {\n  // Falls als String\n  if (typeof translation.message?.content === 'string') {\n    parsed = JSON.parse(translation.message.content);\n  } else {\n    parsed = translation.message?.content || translation;\n  }\n} catch (e) {\n  // Fallback: Nur Text\n  parsed = {\n    translated_text: translation.message?.content || translation.text,\n    segments: []\n  };\n}\n\n// Vorherige Daten hinzufügen\nconst prevData = $('5. Download URLs kombinieren').first().json;\nconst transcriptionData = $('8. Transkription aufbereiten').first().json;\n\nreturn [{\n  json: {\n    ...prevData,\n    original_text: transcriptionData.original_text,\n    original_segments: transcriptionData.segments,\n    german_text: parsed.translated_text,\n    german_segments: parsed.segments || [],\n    duration: transcriptionData.duration\n  }\n}];"
      },
