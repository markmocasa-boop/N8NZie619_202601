        "messages": {
          "values": [
            {
              "content": "Du bist ein professioneller Übersetzer, spezialisiert auf technische Inhalte und Tutorial-Videos.\n\nDeine Aufgabe:\n1. Übersetze den Text natürlich und flüssig ins Deutsche\n2. Behalte technische Begriffe (z.B. \"Workflow\", \"Node\", \"API\") im Original\n3. Passe den Ton an ein professionelles Tutorial an\n4. Achte auf korrekte Satzstruktur für Text-to-Speech\n5. Halte die Segmentierung bei, damit Audio synchron bleibt\n\nAntworte im JSON-Format mit:\n- translated_text: Der vollständige übersetzte Text\n- segments: Array mit übersetzten Segmenten (behalte start/end Zeiten bei)",
              "role": "system"
            },
            {
              "content": "=Übersetze folgendes Transkript ins Deutsche. Behalte die Segment-Struktur für die Audio-Synchronisation bei.\n\nOriginal-Sprache: {{ $json.detected_language }}\n\nTranskript:\n{{ $json.original_text }}\n\nSegmente mit Zeitstempeln:\n{{ JSON.stringify($json.segments, null, 2) }}"
            }
          ]
        },
