    {
      "parameters": {
        "jsCode": "// Avatar-Entfernung über Cloudinary Transformation\n// HINWEIS: Dies funktioniert nur, wenn der Avatar an einer festen Position ist\n\nconst videoData = $('14. Video zu Cloudinary').first().json;\nconst metadata = $('5. Download URLs kombinieren').first().json;\n\n// Avatar-Position aus Input (Standard: bottom-right)\nconst avatarPos = metadata.avatar_position || 'bottom-right';\nconst avatarSize = metadata.avatar_size || 150;\n\n// Cloudinary Overlay-Transformation für Avatar-Abdeckung\n// Option 1: Blur-Overlay über Avatar-Bereich\n// Option 2: Crop um Avatar-Bereich zu entfernen\n\nlet transformation = '';\n\nswitch(avatarPos) {\n  case 'bottom-right':\n    // Overlay mit Blur am unteren rechten Rand\n    transformation = `e_blur_region:${avatarSize},g_south_east`;\n    break;\n  case 'bottom-left':\n    transformation = `e_blur_region:${avatarSize},g_south_west`;\n    break;\n  case 'top-right':\n    transformation = `e_blur_region:${avatarSize},g_north_east`;\n    break;\n  case 'top-left':\n    transformation = `e_blur_region:${avatarSize},g_north_west`;\n    break;\n  default:\n    // Kein Blur\n    transformation = '';\n}\n\n// Video URL mit Transformation\nconst baseUrl = videoData.secure_url.replace('/upload/', `/upload/${transformation}/`);\n\nreturn [{\n  json: {\n    video_public_id: videoData.public_id,\n    original_video_url: videoData.secure_url,\n    processed_video_url: transformation ? baseUrl : videoData.secure_url,\n    transformation_applied: transformation,\n    avatar_position: avatarPos,\n    avatar_size: avatarSize,\n    note: 'Für komplexe Avatar-Entfernung empfehlen wir Runway ML Inpainting (manuell)'\n  }\n}];"
      },
