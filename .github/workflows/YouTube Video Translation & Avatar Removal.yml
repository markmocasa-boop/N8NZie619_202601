        "jsCode": "// Finale Ausgabe vorbereiten\nconst renderResult = $('18. Render Status prüfen').first().json;\nconst metadata = $('10. Übersetzung parsen').first().json;\n\nconst finalVideoUrl = renderResult.response?.url;\n\nreturn [{\n  json: {\n    success: true,\n    final_video_url: finalVideoUrl,\n    title: metadata.title + ' (Deutsche Version)',\n    original_text: metadata.original_text,\n    german_text: metadata.german_text,\n    render_id: renderResult.response?.id,\n    message: 'Video erfolgreich übersetzt und zusammengeführt!',\n    notes: [\n      'Das Video enthält nun den deutschen Voiceover.',\n      'Der Avatar-Bereich wurde nach Möglichkeit verarbeitet.',\n      'Für perfekte Avatar-Entfernung empfehlen wir zusätzlich Runway ML Inpainting.'\n    ]\n  }\n}];"
