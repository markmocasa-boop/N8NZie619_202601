        "jsCode": "// Video-Metadaten aus beiden Quellen extrahieren\nconst youtubeInfo = $('YouTube Video Info abrufen').first().json;\nconst transcript = $('Supadata.ai Transkript').first().json;\nconst formData = $('On form submission').first().json;\n\n// Video ID aus URL extrahieren\nconst url = formData['YT Url'] || '';\nconst videoIdMatch = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);\nconst videoId = videoIdMatch ? videoIdMatch[1] : '';\n\nreturn [{\n  json: {\n    video_id: videoId,\n    title: youtubeInfo.title || '',\n    channel: youtubeInfo.author_name || '',\n    thumbnail: youtubeInfo.thumbnail_url || '',\n    video_url: formData['YT Url'] || '',\n    download_url: `https://www.youtube.com/watch?v=${videoId}`,\n    transcript: transcript.content || '',\n    language: transcript.lang || 'en',\n    avatar_position: formData.avatar_position || 'bottom-right',\n    avatar_size: formData.avatar_size || 150\n  }\n}];\n"
